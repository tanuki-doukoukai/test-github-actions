name: Test PR Review Request

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to add reviewer'
        required: true
        type: string
      reviewers:
        description: 'GitHub username(s) to add as reviewer (comma-separated for multiple)'
        required: true
        type: string

jobs:
  test-pr-review-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.TANUKI_2_APP_ID }}
          private-key: ${{ secrets.TANUKI_2_PRIVATE_KEY }}

      - name: Request Pull Request Review
        run: |
          echo "Adding reviewer(s) to PR #${{ inputs.pr_number }}"
          echo "Reviewers: ${{ inputs.reviewers }}"
          
          # Use REST API directly to avoid GraphQL organization.teams permission issue
          echo "Using gh api to add reviewer(s)..."
          
          # Convert comma-separated list to JSON array
          REVIEWERS_JSON=$(echo "${{ inputs.reviewers }}" | jq -R 'split(",") | map(gsub("^\\s+|\\s+$";""))')
          echo "Reviewers JSON: ${REVIEWERS_JSON}"
          
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}/requested_reviewers" \
            --input - <<< "{\"reviewers\": ${REVIEWERS_JSON}}"
          
          echo "Reviewer request sent successfully"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Verify Review Request
        run: |
          echo "Checking if reviewer was added successfully..."
          gh pr view ${{ inputs.pr_number }} --json reviewRequests | jq '.reviewRequests'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}