name: Test PR Creation

on:
  workflow_dispatch:
    inputs:
      pr_title:
        description: 'Pull Request title'
        required: true
        type: string
        default: 'Test PR from dispatch workflow'
      pr_body:
        description: 'Pull Request body/description (supports multi-line)'
        required: false
        type: string
        default: |
          ## Test PR Description
          
          This is a test PR created via workflow dispatch.
          
          ### Features
          - Support for multi-line descriptions
          - Markdown formatting
          
          ### Notes
          You can use:
          1. Numbered lists
          2. Bullet points
          3. **Bold** and *italic* text
          
          ---
          End of description
      head_branch:
        description: 'Head branch for the PR'
        required: true
        type: string
      base_branch:
        description: 'Base branch for the PR'
        required: false
        type: string
        default: 'main'
      assignees:
        description: 'Comma-separated list of assignees'
        required: false
        type: string

jobs:
  test-pr-creation:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.create-pull-request.outputs.number }}
      pr_title: ${{ steps.create-pull-request.outputs.title }}
      pr_url: ${{ steps.create-pull-request.outputs.html_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.TANUKI_2_APP_ID }}
          private-key: ${{ secrets.TANUKI_2_PRIVATE_KEY }}

      - name: Create Pull Request
        id: create-pull-request
        run: |
          echo "========== Step 1: Preparing PR Body =========="
          # Handle multi-line body properly
          PR_BODY="${{ inputs.pr_body }}"
          echo "PR_BODY (raw input):"
          echo "---START OF BODY---"
          echo "${PR_BODY}"
          echo "---END OF BODY---"
          echo ""
          echo "Number of lines in body: $(echo "${PR_BODY}" | wc -l)"
          
          echo ""
          echo "========== Step 2: Creating PR =========="
          echo "Command: gh pr create --title \"${{ inputs.pr_title }}\" --head \"${{ inputs.head_branch }}\" --base \"${{ inputs.base_branch }}\" --body \"${PR_BODY}\" --repo \"${{ github.repository }}\""
          
          PR_URL=$(gh pr create \
            --title "${{ inputs.pr_title }}" \
            --head "${{ inputs.head_branch }}" \
            --base "${{ inputs.base_branch }}" \
            --body "${PR_BODY}" \
            --repo "${{ github.repository }}")
          
          echo "PR_URL returned: ${PR_URL}"
          
          echo ""
          echo "========== Step 3: Getting PR Data =========="
          echo "Command: gh pr view \"${PR_URL}\" --json number,title,url"
          
          PR_DATA=$(gh pr view "${PR_URL}" --json number,title,url)
          echo "PR_DATA (raw JSON): ${PR_DATA}"
          
          echo ""
          echo "========== Step 4: Extracting PR Information =========="
          PR_NUMBER=$(echo "${PR_DATA}" | jq -r .number)
          echo "PR_NUMBER extracted: ${PR_NUMBER}"
          
          PR_TITLE=$(echo "${PR_DATA}" | jq -r .title)
          echo "PR_TITLE extracted: ${PR_TITLE}"
          
          PR_HTML_URL=$(echo "${PR_DATA}" | jq -r .url)
          echo "PR_HTML_URL extracted: ${PR_HTML_URL}"

          echo ""
          echo "========== Step 5: Validation =========="
          if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
            echo "ERROR: Failed to create PR or retrieve PR number." >&2
            echo "PR_NUMBER value: '${PR_NUMBER}'" >&2
            exit 1
          fi
          echo "Validation passed: PR_NUMBER is valid"

          echo ""
          echo "========== Step 6: Assignee Processing =========="
          if [ "${{ inputs.assignees }}" != "" ]; then
            echo "Assignees input: '${{ inputs.assignees }}'"
            IFS=',' read -r -a ASSIGNEE_ARRAY <<< "${{inputs.assignees}}"
            echo "Number of assignees: ${#ASSIGNEE_ARRAY[@]}"
            for assignee in "${ASSIGNEE_ARRAY[@]}"; do
              echo "Adding assignee: ${assignee}"
              gh pr edit "${PR_NUMBER}" --add-assignee "${assignee}"
              echo "Assignee ${assignee} added successfully"
            done
          else
            echo "No assignees to add"
          fi

          echo ""
          echo "========== Step 7: Setting GitHub Output =========="
          echo "number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "Written to GITHUB_OUTPUT: number=${PR_NUMBER}"
          
          echo "title=${PR_TITLE}" >> "${GITHUB_OUTPUT}"
          echo "Written to GITHUB_OUTPUT: title=${PR_TITLE}"
          
          echo "html_url=${PR_HTML_URL}" >> "${GITHUB_OUTPUT}"
          echo "Written to GITHUB_OUTPUT: html_url=${PR_HTML_URL}"
          
          echo ""
          echo "========== PR Creation Complete =========="
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Display PR Information
        run: |
          echo "PR Created Successfully!"
          echo "PR Number: ${{ steps.create-pull-request.outputs.number }}"
          echo "PR Title: ${{ steps.create-pull-request.outputs.title }}"
          echo "PR URL: ${{ steps.create-pull-request.outputs.html_url }}"