name: Test Notification Dispatch

on:
  workflow_dispatch:
    inputs:
      required_action_type:
        description: 'Type of action required'
        required: true
        type: choice
        options:
          - review
          - merge
          - update
          - conflict
        default: 'review'
      author:
        description: 'PR author username'
        required: true
        type: string
      pr_number:
        description: 'Pull Request number'
        required: true
        type: string
      pr_title:
        description: 'Pull Request title'
        required: true
        type: string
      pr_html_url:
        description: 'Pull Request URL'
        required: true
        type: string
      target_repository:
        description: 'Target repository for dispatch (format: owner/repo)'
        required: false
        type: string
        default: ''
      event_type:
        description: 'Event type for dispatch'
        required: false
        type: string
        default: 'pr-notification'

env:
  DISPATCH_NOTIFY_REPOSITORIES: ${{ inputs.target_repository || vars.DISPATCH_NOTIFY_REPOSITORIES || 'target-repo' }}
  DISPATCH_NOTIFY_EVENT_TYPE: ${{ inputs.event_type }}

jobs:
  test-notification-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Inputs
        run: |
          echo "Testing notification dispatch with the following parameters:"
          echo "Required Action Type: ${{ inputs.required_action_type }}"
          echo "Author: ${{ inputs.author }}"
          echo "PR Number: ${{ inputs.pr_number }}"
          echo "PR Title: ${{ inputs.pr_title }}"
          echo "PR URL: ${{ inputs.pr_html_url }}"
          echo "Target Repository: ${{ env.DISPATCH_NOTIFY_REPOSITORIES }}"
          echo "Event Type: ${{ env.DISPATCH_NOTIFY_EVENT_TYPE }}"

      - uses: actions/create-github-app-token@v1
        id: dispatch-notify-token
        with:
          app-id: ${{ secrets.TANUKI_2_APP_ID }}
          private-key: ${{ secrets.TANUKI_2_PRIVATE_KEY }}
          repositories: ${{ env.DISPATCH_NOTIFY_REPOSITORIES }}

      - name: Dispatch Notify Workflow
        run: |
          echo "Dispatching notification to repository: ${{ github.repository_owner }}/${{ env.DISPATCH_NOTIFY_REPOSITORIES }}"
          
          gh api repos/${{ github.repository_owner }}/${{ env.DISPATCH_NOTIFY_REPOSITORIES }}/dispatches \
            --method POST \
            --field event_type="${{ env.DISPATCH_NOTIFY_EVENT_TYPE }}" \
            --field client_payload[required_action_type]="${{ inputs.required_action_type }}" \
            --field client_payload[author]="${{ inputs.author }}" \
            --raw-field client_payload[pull_request][number]="${{ inputs.pr_number }}" \
            --field client_payload[pull_request][title]="${{ inputs.pr_title }}" \
            --field client_payload[pull_request][html_url]="${{ inputs.pr_html_url }}"
        env:
          GH_TOKEN: ${{ steps.dispatch-notify-token.outputs.token }}

      - name: Dispatch Status
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "✅ Dispatch sent successfully!"
          else
            echo "❌ Dispatch failed!"
            exit 1
          fi