name: Concurrent Workflow 4

on:
  push:
    branches:
      - 'auto/**'
  workflow_dispatch:

jobs:
  job4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Workflow 4
        run: |
          echo "Starting Concurrent Workflow 4"
          echo "Current time: $(date)"
          sleep 12
          echo "Workflow 4 completed"
