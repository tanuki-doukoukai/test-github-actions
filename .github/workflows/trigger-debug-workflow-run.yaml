name: Trigger / Debug Workflow Run

on:
  pull_request:
    paths:
      - 'diff.md'

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Simple test
        run: |
          echo "This workflow will trigger 'Debug Workflow Run PR Search' workflow"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Event: ${{ github.event_name }}"
          echo ""
          echo "Sleeping for 10 seconds to ensure workflow_run can catch this..."
          sleep 60
          echo "Done!"
